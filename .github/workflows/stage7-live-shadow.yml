name: Stage7 one-off existing MIS artifact shadow acceptance
on:
  push:
    branches: [stage4/20261016-fugle-probe]
    paths: [stage7_live.request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage7-one-off-artifact-shadow-only
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing formal MIS Artifact only; no provider or publisher Secret
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -u stage8_mis_shadow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-live-safe-${{ github.run_id }}
          path: stage7-live-safe-report/
          retention-days: 30
