name: TWSE MIS Closing Auction Probe
run-name: MIS ${{ inputs.mode || (github.event_name == 'schedule' && 'live') || 'dry-run' }} / ${{ inputs.trigger_source || github.event_name }} / ${{ inputs.dispatch_test_id || github.run_number }}
on:
  push:
    paths:
      - 'probe.py'
      - 'freshness.py'
      - 'convergence.py'
      - 'test_convergence.py'
      - 'official_retry.py'
      - 'tradable.py'
      - 'official_quotes.py'
      - 'run_control.py'
      - 'test_freshness.py'
      - 'test_dispatch.py'
      - 'test_status.cjs'
      - 'docs/status.js'
      - '.github/workflows/twse-mis-probe.yml'
  schedule:
    - cron: "47 3 * * 1-5"
    - cron: "7 5 * * 1-5"
    - cron: "12,17,22 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only checks connectivity; live obeys strict capture deadlines"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
          - dispatch-safety
      trigger_source:
        description: "Caller declaration only; external setup requires a verified cron-job.org test"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cron-job.org
          - cron-job.org-test
          - dispatch-safety-test
      dispatch_test_id:
        description: "Leave empty for live/dry-run; numeric isolated dedup test id only"
        required: false
        default: ""
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: twse-mis-live
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      TZ: Asia/Taipei
      STATUS_ISSUE_NUMBER: "1"
      GITHUB_TOKEN: ${{ github.token }}
      PROBE_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'dry-run' }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
      TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
      DISPATCH_TEST_ID: ${{ inputs.dispatch_test_id || '' }}
    steps:
      - name: Record actual runner start before setup
        run: |
          MIS_RUNNER_START=$(date '+%Y-%m-%dT%H:%M:%S.%3N%:z')
          echo "RUNNER_STARTED_AT=$MIS_RUNNER_START" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify freshness, date gates and no-backfill behavior
        run: python -m unittest -v test_probe.py test_run_control.py test_freshness.py test_convergence.py test_dispatch.py
      - name: Verify status page date, missing-day and credential-free gates
        run: node --test test_status.cjs
      - name: Run controlled probe
        id: probe
        run: python run_control.py --mode "$PROBE_MODE" --output results
      - name: Upload raw evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-probe-${{ github.run_id }}
          path: |
            results/
            mis-probe-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve specific failure and mark unexpected controller termination
        if: failure()
        run: python run_control.py --mode workflow-failure --output results
