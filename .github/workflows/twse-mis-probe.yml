name: TWSE MIS Closing Auction Probe
on:
  schedule:
    - cron: "47 3 * * 1-5"
    - cron: "7 5 * * 1-5"
    - cron: "12,17,22 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only checks connectivity; live obeys strict capture deadlines"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live
permissions:
  contents: write
  issues: write
concurrency:
  group: twse-mis-live
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    env:
      TZ: Asia/Taipei
      STATUS_ISSUE_NUMBER: "1"
      GITHUB_TOKEN: ${{ github.token }}
      PROBE_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
    steps:
      - name: Record actual runner start before setup
        run: echo "RUNNER_STARTED_AT=$(date --iso-8601=milliseconds)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run controlled probe
        id: probe
        run: python run_control.py --mode "$PROBE_MODE" --output results
      - name: Upload raw evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mis-probe-${{ github.run_id }}
          path: |
            results/
            mis-probe-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve specific failure and mark unexpected controller termination
        if: failure()
        run: python run_control.py --mode workflow-failure --output results
