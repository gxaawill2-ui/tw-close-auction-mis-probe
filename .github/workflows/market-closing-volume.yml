name: Market closing turnover saved evidence
on:
  schedule:
    - cron: '5 7,10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: market-closing-volume-independent
  cancel-in-progress: false
jobs:
  accumulate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse saved artifact and read only an official daily table
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python market_closing_runner.py
      - name: Publish isolated market data and attempt health with bounded CAS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/market-closing-volume
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Accumulate independent saved market closing evidence"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-closing-evidence-${{ github.run_id }}
          path: |
            market-evidence/
            state/market-closing-volume/
          retention-days: 90
          if-no-files-found: error
      - name: Surface failure while preserving prior published data
        if: steps.collect.outcome == 'failure'
        run: exit 1
