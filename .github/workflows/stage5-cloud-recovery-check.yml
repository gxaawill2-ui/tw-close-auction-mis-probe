name: Stage5 new runner private evidence recovery
on:
  push:
    branches: [stage4/20261016-fugle-probe]
    paths: [stage5_cloud_recovery.request.json]
permissions:
  contents: read
concurrency:
  group: stage5-synthetic-cloud-recovery-only
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: stage4-fugle-isolated
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover previous runner canary; no market provider requests
        env:
          STAGE5_PUBLISH_TOKEN: ${{ secrets.STAGE5_PUBLISH_TOKEN }}
          STAGE5_DECISION_KEY: ${{ secrets.STAGE5_DECISION_KEY }}
        run: python3 stage5_cloud_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-synthetic-cloud-recovery-${{ github.run_id }}
          path: stage5-cloud-recovery-report/
          retention-days: 30
